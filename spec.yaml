blueprint:
  id: wax-social-recovery-and-key-backup-tools
  name: Social Recovery & Key Backup Tools
  tier: 1
  category: security-foundational
  status: refined
  version: "0.5.0"
  last_refined: "2026-10-18"

metadata:
  description: |
    Educational backup posture scoring and social recovery risk analysis for
    Antelope/WAX — checklists, warnings, workflow steps. Not a custody product.
  related_blueprints:
    - wax-secure-key-management-and-privacy-tools
    - wax-multi-sig-proposal-builder-and-simulator
    - wax-hardware-wallet-integration-patterns
  related_docs:
    - wax-ecosystem-blueprint-catalog/ECOSYSTEM-RESILIENCE.md
    - wax-ecosystem-blueprint-catalog/PX-PERFECTION-STANDARD.md

invariants:
  - Checklists and risks are pure functions
  - Risks cite triggers
  - Single-helper full control flagged high
  - Seed-sharing with helpers flagged high
  - Runbooks must not depend on a single website only

features:
  implemented:
    - scoreBackupPosture
    - analyzeSocialRecovery
    - BackupChecklist, SecurityWarnings, RecoveryWorkflow, demo

machine_instructions:
  - Use src/engines.ts for scoring and risks
  - Prefer multi-sig weights over sharing full seeds
  - Reference PX §11 for runbook continuity

technical_requirements:
  framework: Next.js 15 + TypeScript (strict)
  styling: Tailwind CSS
